[project]
name = "Cyber-Job-Hunter"
version = "0.1.0"
description = "Automated cyber security job scraper with profile-based scoring — personal portfolio project"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Johan-Emmanuel Hatchi" },
]
keywords = ["cybersecurity", "job-scraper", "blue-team", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/Jhatchi/Cyber-Job-Hunter"
Issues  = "https://github.com/Jhatchi/Cyber-Job-Hunter/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ─── Ruff ────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff specific
    "PL",            # pylint subset
    "S",             # bandit (sécurité)
]
ignore = [
    "S101",     # assert used (ok in tests)
    "PLR0913",  # too many arguments
    "PLR2004",  # magic values: HTTP status codes (200/429/500) and UI thresholds are not defects
    "RUF002",   # ambiguous unicode in docstrings: FR characters are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S",        # bandit: test code uses fixtures, not prod paths
    "PLR2004",  # magic values: tests compare to literal values
    "E501",     # long lines: HTML/JSON fixtures are legitimately long
    "PLC0415",  # local imports: tests use lazy imports for clarity
    "RUF001",   # ambiguous unicode in strings (FR fixtures)
    "RUF002",   # ambiguous unicode in docstrings (FR comments)
    "RUF003",   # ambiguous unicode in comments
]
"dashboard/**/*.py" = [
    "E501",     # long lines: aligned dict tables and Streamlit markdown
    "PLC0415",  # local imports common in Streamlit views
    "PLR0912",  # too many branches: dashboard loaders fan out per filter
]
"scripts/**/*.py" = [
    "PLR0912",  # too many branches: orchestrator dispatches per source
    "PLR0915",  # too many statements: orchestrator setup is sequential
]

[tool.ruff.lint.pylint]
max-branches = 18
max-statements = 60

# ─── Mypy ────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["feedparser.*", "hishel.*"]
ignore_missing_imports = true

# SQLModel/SQLAlchemy and BeautifulSoup4 have known typing limitations:
# - Field comparisons return bool to mypy instead of ColumnElement[bool]
# - AttributeValueList from bs4 is not narrowed to str by mypy
# Strict typing is kept for the core (scoring, filters, models, config, deduplication).
[[tool.mypy.overrides]]
module = ["src.storage", "src.scrapers.*"]
disable_error_code = ["arg-type", "attr-defined", "union-attr"]

# ─── Pytest ──────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
markers = [
    "integration: tests qui font de vrais appels réseau (skipped par défaut)",
    "slow: tests lents (>1s)",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
